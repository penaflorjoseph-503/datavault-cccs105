{% extends 'base.html' %}

{% block auth_content %}
<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-icon"><i class="fa-solid fa-database"></i></div>
    <span class="brand-text">DataVault</span>
  </div>

  <h1 class="auth-title">Create Account</h1>
  <p class="auth-sub">Register to get access to the system.</p>

  {% if error %}
  <div class="alert alert--danger" style="margin-bottom:18px;">
    <i class="fa-solid fa-circle-xmark"></i> {{ error }}
  </div>
  {% endif %}

  <form method="POST">
    <div class="form-group" style="margin-bottom:14px;">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username"
             value="{{ request.form.get('username', '') }}" required autofocus />
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Min. 6 characters" required />
    </div>
    <div class="form-group" style="margin-bottom:22px;">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required />
    </div>
    <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;">
      <i class="fa-solid fa-user-plus"></i> Create Account
    </button>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
  </div>
</div>
{% endblock %}
