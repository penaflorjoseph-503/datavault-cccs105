{% extends 'base.html' %}

{% block auth_content %}
<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-icon"><i class="fa-solid fa-database"></i></div>
    <span class="brand-text">DataVault</span>
  </div>

  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-sub">Sign in to your account to continue.</p>

  {% if error %}
  <div class="alert alert--danger" style="margin-bottom:18px;">
    <i class="fa-solid fa-circle-xmark"></i> {{ error }}
  </div>
  {% endif %}

  <form method="POST" autocomplete="on">
    <div class="form-group" style="margin-bottom:14px;">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username"
             value="{{ request.form.get('username', '') }}" required autofocus />
    </div>
    <div class="form-group" style="margin-bottom:22px;">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required />
    </div>
    <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;">
      <i class="fa-solid fa-right-to-bracket"></i> Sign In
    </button>
  </form>

  <div class="auth-footer">
    Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
  </div>
</div>
{% endblock %}
